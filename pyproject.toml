[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muthukazid-jailbreak_template_variants_dedup"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出模型微调平台工程师·越狱模板的变体识别上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "muthukazid" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://muthukazid.github.io"
Repository = "https://github.com/muthukazid/jailbreak_template_variants_dedup"
Issues = "https://github.com/muthukazid/jailbreak_template_variants_dedup/issues"

[project.scripts]
jailbreak_template_variants_dedup = "jailbreak_template_variants_dedup:main"

[tool.setuptools]
py-modules = ["jailbreak_template_variants_dedup"]
